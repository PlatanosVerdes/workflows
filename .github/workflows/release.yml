name: Release

# Tag and image share one workflow because a tag pushed with GITHUB_TOKEN triggers nothing.

on:
  workflow_call:
    inputs:
      deploy-repo:
        description: Repo whose deploy workflow runs after every published image.
        type: string
        default: ''
      deploy-workflow:
        type: string
        default: bump-app-versions.yml
    secrets:
      DEPLOY_TOKEN:
        description: Fine-grained token with only Actions write on deploy-repo.
        required: false
    outputs:
      tag:
        value: ${{ jobs.tag.outputs.tag }}
      image:
        value: ${{ jobs.image.outputs.image }}

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-tag-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create CalVer tag
        id: tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --tags --force --prune-tags --quiet

            # A dot, never a dash: `sort -V` reads v2026.08.18-9 as older than v2026.08.18.1.
            base="v$(date +%Y.%m.%d)"
            tag="$base"
            n=1
            while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
              tag="$base.$n"
              n=$((n + 1))
            done

            git tag -a "$tag" -m "Release $tag"
            if git push origin "$tag"; then
              echo "Created tag $tag"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Tag $tag already exists on the remote, retrying ($attempt/5)"
            git tag -d "$tag"
            sleep $((attempt * 2))
          done

          echo "Could not create a tag after 5 attempts"
          exit 1

  image:
    needs: tag
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Image name
        id: name
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/$repo:${{ needs.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}
          build-args: VERSION=${{ needs.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    needs: [tag, image]
    if: inputs.deploy-repo != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # workflow_dispatch and not repository_dispatch: it needs Actions write, which cannot touch code.
      - name: Run the deploy workflow
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          gh workflow run "${{ inputs.deploy-workflow }}" -R "${{ inputs.deploy-repo }}" \
            -f app="${{ github.event.repository.name }}" -f tag="${{ needs.tag.outputs.tag }}"
